<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel SAC - Devoluções</title>
<style>
  :root {
    --verde: #0f7a3d; --verde-claro: #e6f4ec; --texto: #1d2329; --cinza: #5f6b76; --borda: #d5dbe0;
    --fundo: #f3f5f7; --branco: #fff; --erro: #c62828; --amarelo: #fff4d6; --amarelo-borda: #e0b440;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--fundo); }
  header { background: var(--verde); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 1.05rem; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--branco); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; }
  input, textarea, select { font: inherit; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; width: 100%; background: #fff; color: var(--texto); }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  .btn { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--verde); background: #fff; color: var(--verde); cursor: pointer; }
  .btn.cheio { background: var(--verde); color: #fff; }
  .btn.perigo { border-color: var(--erro); color: var(--erro); }
  .btn:disabled { opacity: .5; cursor: default; }
  .login { max-width: 360px; margin: 60px auto; }
  .abas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .abas button { font: inherit; border: 1px solid var(--borda); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .abas button.ativa { background: var(--verde); border-color: var(--verde); color: #fff; }
  .grade { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grade { grid-template-columns: 1fr; } }
  .lista { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 170px); overflow: auto; }
  .linha { text-align: left; background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; }
  .linha.ativa { border-color: var(--verde); box-shadow: 0 0 0 2px var(--verde-claro); }
  .linha .topo { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .linha .sub { color: var(--cinza); font-size: .88rem; }
  .selo { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eef1f4; color: var(--cinza); white-space: nowrap; }
  .selo.aguardando_sac { background: var(--amarelo); color: #8a6100; }
  .selo.pendente_complemento { background: #e8f0fe; color: #1a56c4; }
  .selo.ocorrencia_aberta { background: var(--verde-claro); color: var(--verde); }
  .selo.reprovada { background: #fdecea; color: var(--erro); }
  .vazio { color: var(--cinza); padding: 20px; text-align: center; }
  dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--cinza); }
  dd { margin: 0; font-weight: 600; word-break: break-word; }
  @media (max-width: 520px) { dl { grid-template-columns: 1fr; } dd { margin-bottom: 6px; } }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  h3 { font-size: .95rem; margin: 18px 0 8px; }
  .alerta { background: var(--amarelo); border: 1px solid var(--amarelo-borda); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .fotos a { display: block; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--borda); position: relative; }
  .fotos img { width: 100%; height: 100%; object-fit: cover; }
  .fotos span { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: .72rem; padding: 1px 6px; border-radius: 4px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .hist { list-style: none; padding: 0; margin: 0; font-size: .88rem; }
  .hist li { border-left: 3px solid var(--borda); padding: 4px 10px; margin-bottom: 4px; }
  .erro { color: var(--erro); font-weight: 600; margin-top: 8px; }
  .oculto { display: none !important; }
  dialog { border: 0; border-radius: 12px; padding: 18px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .resumo { white-space: pre-wrap; background: #f7f8fa; border: 1px solid var(--borda); border-radius: 8px; padding: 10px; font-size: .88rem; }
</style>
</head>
<body>
<header>
  <h1>Devoluções · Painel do SAC</h1>
  <div>
    <button id="atualizar" class="oculto" type="button">Atualizar</button>
    <button id="sair" class="oculto" type="button">Sair</button>
  </div>
</header>

<main>
  <form id="login" class="card login">
    <h2>Entrar</h2>
    <label for="senha">Senha do painel</label>
    <input id="senha" type="password" autocomplete="current-password">
    <label for="atendente">Seu nome</label>
    <input id="atendente" type="text" autocomplete="name">
    <div style="margin-top:14px"><button class="btn cheio" type="submit">Entrar</button></div>
    <div id="loginErro" class="erro"></div>
  </form>

  <div id="app" class="oculto">
    <div class="abas" id="abas">
      <button type="button" data-s="abertas" class="ativa">A analisar</button>
      <button type="button" data-s="ocorrencia_aberta">Ocorrência aberta</button>
      <button type="button" data-s="reprovada">Reprovadas</button>
      <button type="button" data-s="todas">Todas</button>
    </div>
    <div class="grade">
      <div id="lista" class="lista"></div>
      <div id="detalhe" class="card"><div class="vazio">Escolha uma solicitação na lista.</div></div>
    </div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitulo"></h2>
    <label id="dlgLabel" for="dlgCampo"></label>
    <input id="dlgCampo" type="text" autocomplete="off">
    <div id="dlgErro" class="erro"></div>
    <div class="acoes">
      <button class="btn cheio" id="dlgOk" value="ok">Confirmar</button>
      <button class="btn" value="cancelar" formnovalidate>Cancelar</button>
    </div>
  </form>
</dialog>

<script>
const API = "https://ywsjvxlasbaytvmwpsbd.supabase.co/functions/v1/formulario-devolucao";
const ATUALIZAR_A_CADA_MS = 60000;

const $ = (id) => document.getElementById(id);
const NOMES_STATUS = {
  aguardando_sac: "A analisar", pendente_complemento: "Aguardando complemento",
  ocorrencia_aberta: "Ocorrência aberta", reprovada: "Reprovada", cancelada: "Cancelada",
  em_coleta: "Em preenchimento", recebida_deposito: "Recebida no depósito",
};
const ss = {
  get(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (_) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (_) {} },
};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};

let senha = ss.get("jr_painel_senha") || "";
let filtro = "abertas";
let selecionado = null;
let timer = null;

const fmt = (iso) => iso ? new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(new Date(iso)) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(acao, { params = {}, corpo = null } = {}) {
  const q = new URLSearchParams({ acao, ...params });
  const r = await fetch(`${API}?${q}`, {
    method: corpo ? "POST" : "GET",
    headers: { "x-senha-sac": senha, ...(corpo ? { "content-type": "application/json" } : {}) },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const j = await r.json().catch(() => ({ ok: false, erro: "Falha de comunicação." }));
  if (r.status === 401) { sair(); throw new Error("Senha incorreta."); }
  if (!j.ok) throw new Error(j.erro || "Erro.");
  return j;
}

// ---------------------------------------------------------------------------
// Login
// ---------------------------------------------------------------------------
$("atendente").value = ls.get("jr_painel_atendente") || "";
$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("loginErro").textContent = "";
  senha = $("senha").value;
  const nome = $("atendente").value.trim();
  if (!nome) { $("loginErro").textContent = "Informe o seu nome."; return; }
  try {
    await api("painel_lista", { params: { status: "abertas" } });
    ss.set("jr_painel_senha", senha);
    ls.set("jr_painel_atendente", nome);
    entrar();
  } catch (err) { $("loginErro").textContent = err.message; }
};

function entrar() {
  $("login").classList.add("oculto");
  $("app").classList.remove("oculto");
  $("atualizar").classList.remove("oculto");
  $("sair").classList.remove("oculto");
  carregarLista();
  clearInterval(timer);
  timer = setInterval(carregarLista, ATUALIZAR_A_CADA_MS);
}

function sair() {
  senha = ""; ss.del("jr_painel_senha"); clearInterval(timer);
  $("app").classList.add("oculto"); $("login").classList.remove("oculto");
  $("atualizar").classList.add("oculto"); $("sair").classList.add("oculto");
  $("senha").value = "";
}
$("sair").onclick = sair;
$("atualizar").onclick = () => { carregarLista(); if (selecionado) abrir(selecionado); };

// ---------------------------------------------------------------------------
// Lista
// ---------------------------------------------------------------------------
$("abas").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.s;
  [...$("abas").children].forEach((x) => x.classList.toggle("ativa", x === b));
  carregarLista();
};

async function carregarLista() {
  const box = $("lista");
  try {
    const { itens } = await api("painel_lista", { params: { status: filtro } });
    if (!itens.length) { box.innerHTML = '<div class="vazio">Nenhuma solicitação aqui.</div>'; return; }
    box.innerHTML = itens.map((s) => `
      <button type="button" class="linha${s.id === selecionado ? " ativa" : ""}" data-id="${s.id}">
        <div class="topo"><span>${esc(s.protocolo)}</span><span class="selo ${esc(s.status)}">${esc(NOMES_STATUS[s.status] || s.status)}</span></div>
        <div>${esc(s.motorista_nome)} · NF ${esc(s.nota_fiscal)}</div>
        <div class="sub">${esc(s.cliente_nome)} · ${esc(s.motivos_devolucao?.nome || s.motivo_codigo)} · ${fmt(s.criado_em)}${s.nf_duplicada_de ? " · ⚠ NF repetida" : ""}</div>
      </button>`).join("");
  } catch (err) {
    box.innerHTML = `<div class="vazio erro">${esc(err.message)}</div>`;
  }
}
$("lista").onclick = (e) => {
  const b = e.target.closest(".linha"); if (!b) return;
  selecionado = Number(b.dataset.id);
  [...$("lista").children].forEach((x) => x.classList.toggle("ativa", x === b));
  abrir(selecionado);
};

// ---------------------------------------------------------------------------
// Detalhe
// ---------------------------------------------------------------------------
function resumoTexto(s, itens) {
  const linhas = [
    `Solicitação ${s.protocolo}`,
    `Motorista: ${s.motorista_nome}${s.telefone_motorista ? " (" + s.telefone_motorista + ")" : ""}`,
    `NF: ${s.nota_fiscal}`,
    `Cliente: ${s.cliente_codigo ? s.cliente_codigo + " - " : ""}${s.cliente_nome}${s.cliente_cidade ? " (" + s.cliente_cidade + ")" : ""}`,
    `Motivo: ${s.motivos_devolucao?.nome || s.motivo_codigo}`,
    `Devolução: ${s.tipo_devolucao === "parcial" ? "Parcial" : "Total"}`,
  ];
  if (itens.length) linhas.push("Itens:", ...itens.map((i) => " - " + i));
  if (s.observacoes) linhas.push(`Obs.: ${s.observacoes}`);
  return linhas.join("\n");
}

async function abrir(id) {
  const box = $("detalhe");
  box.innerHTML = '<div class="vazio">Carregando…</div>';
  try {
    const { solicitacao: s, itens, anexos, historico } = await api("painel_detalhe", { params: { id } });
    const mapa = s.latitude != null
      ? `<a href="https://www.google.com/maps?q=${s.latitude},${s.longitude}" target="_blank" rel="noopener">Abrir no mapa</a>`
      : esc(s.localizacao_justificativa ? "Não enviada: " + s.localizacao_justificativa : "Não enviada");
    const canhoto = anexos.some((a) => a.tipo === "canhoto")
      ? "Enviado" : esc(s.canhoto_justificativa ? "Sem canhoto: " + s.canhoto_justificativa : "Não enviado");
    const fotos = anexos.filter((a) => a.url).map((a) => `
      <a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.url)}" alt="${a.tipo === "canhoto" ? "Canhoto" : "Foto do produto"}" loading="lazy"><span>${a.tipo === "canhoto" ? "Canhoto" : "Produto"}</span></a>`).join("");
    const resumo = resumoTexto(s, itens);

    const podeDecidir = ["aguardando_sac", "pendente_complemento"].includes(s.status);
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start;flex-wrap:wrap">
        <div><h2>${esc(s.protocolo)}</h2><div class="sub" style="color:var(--cinza)">Enviada em ${fmt(s.criado_em)}</div></div>
        <span class="selo ${esc(s.status)}">${esc(NOMES_STATUS[s.status] || s.status)}</span>
      </div>
      ${s.nf_duplicada_de ? `<div class="alerta">⚠ Já existe outra solicitação com esta NF: <b>${esc(s.nf_duplicada_de)}</b></div>` : ""}
      ${s.numero_devolucao ? `<div class="alerta" style="background:var(--verde-claro);border-color:var(--verde)">Ocorrência aberta: <b>${esc(s.numero_devolucao)}</b> por ${esc(s.decidido_por)}</div>` : ""}
      ${s.status === "reprovada" ? `<div class="alerta" style="background:#fdecea;border-color:var(--erro)">Reprovada por ${esc(s.decidido_por)}: ${esc(s.decisao_motivo)}</div>` : ""}
      ${s.status === "pendente_complemento" ? `<div class="alerta" style="background:#e8f0fe;border-color:#1a56c4">Complemento pedido: ${esc(s.complemento_pedido)}</div>` : ""}
      <h3>Dados</h3>
      <dl>
        <dt>Motorista</dt><dd>${esc(s.motorista_nome)}${s.telefone_motorista ? ` · <a href="https://wa.me/${esc(s.telefone_motorista.replace(/\D/g, "").replace(/^(?!55)/, "55"))}" target="_blank" rel="noopener">${esc(s.telefone_motorista)}</a>` : ""}</dd>
        <dt>Nota fiscal</dt><dd>${esc(s.nota_fiscal)}</dd>
        <dt>Cliente</dt><dd>${s.cliente_codigo ? esc(s.cliente_codigo) + " · " : ""}${esc(s.cliente_nome)}${s.cliente_cidade ? " · " + esc(s.cliente_cidade) : ""}${!s.cliente_id ? " <span class='selo'>digitado</span>" : ""}</dd>
        <dt>Motivo</dt><dd>${esc(s.motivos_devolucao?.nome || s.motivo_codigo)}</dd>
        <dt>Devolução</dt><dd>${s.tipo_devolucao === "parcial" ? "Parcial" : "Total"}</dd>
        ${itens.length ? `<dt>Itens</dt><dd>${itens.map(esc).join("<br>")}</dd>` : ""}
        <dt>Canhoto</dt><dd>${canhoto}</dd>
        <dt>Localização</dt><dd>${mapa}</dd>
        ${s.observacoes ? `<dt>Observações</dt><dd>${esc(s.observacoes)}</dd>` : ""}
      </dl>
      <h3>Fotos (${anexos.length})</h3>
      ${fotos ? `<div class="fotos">${fotos}</div>` : '<div class="sub" style="color:var(--cinza)">Sem fotos.</div>'}
      <h3>Resumo para copiar</h3>
      <div class="resumo" id="resumo">${esc(resumo)}</div>
      <div class="acoes"><button type="button" class="btn" id="copiar">Copiar resumo</button></div>
      ${podeDecidir ? `
      <h3>Decisão</h3>
      <div class="acoes">
        <button type="button" class="btn cheio" data-acao="abrir">Ocorrência aberta (informar DEV)</button>
        ${s.status === "aguardando_sac"
          ? '<button type="button" class="btn" data-acao="complemento">Pedir complemento</button>'
          : '<button type="button" class="btn" data-acao="complemento_recebido">Complemento recebido</button>'}
        <button type="button" class="btn perigo" data-acao="reprovar">Reprovar</button>
      </div>` : ""}
      <h3>Histórico</h3>
      <ul class="hist">${historico.map((h) => `<li>${fmt(h.criado_em)} · ${esc(NOMES_STATUS[h.status_novo] || h.status_novo)} · ${esc(h.autor_nome || h.autor_tipo)}${h.comentario ? " · " + esc(h.comentario) : ""}</li>`).join("")}</ul>`;

    $("copiar").onclick = async () => {
      try { await navigator.clipboard.writeText(resumo); $("copiar").textContent = "Copiado ✓"; }
      catch (_) { $("copiar").textContent = "Selecione o texto e copie"; }
    };
    box.querySelectorAll("[data-acao]").forEach((b) => b.onclick = () => decidir(s, b.dataset.acao));
  } catch (err) {
    box.innerHTML = `<div class="vazio erro">${esc(err.message)}</div>`;
  }
}

// ---------------------------------------------------------------------------
// Decisao
// ---------------------------------------------------------------------------
const TEXTOS = {
  abrir: ["Ocorrência aberta", "Número da DEV no Jr-Oper", "Ex.: DEV-2026-0149", "numero_devolucao"],
  complemento: ["Pedir complemento", "O que está faltando? (avise o motorista pelo WhatsApp)", "", "comentario"],
  complemento_recebido: ["Complemento recebido", "O que o motorista mandou? (opcional)", "", "comentario"],
  reprovar: ["Reprovar solicitação", "Motivo da reprovação", "", "comentario"],
};

function decidir(s, acao) {
  const [titulo, rotulo, ph, campo] = TEXTOS[acao];
  $("dlgTitulo").textContent = `${titulo} · ${s.protocolo}`;
  $("dlgLabel").textContent = rotulo;
  $("dlgCampo").value = ""; $("dlgCampo").placeholder = ph; $("dlgErro").textContent = "";
  const dlg = $("dlg");
  dlg.showModal();
  $("dlgOk").onclick = async (e) => {
    e.preventDefault();
    const valor = $("dlgCampo").value.trim();
    $("dlgOk").disabled = true;
    try {
      await api("painel_status", { corpo: { id: s.id, acao, atendente: ls.get("jr_painel_atendente") || "SAC", [campo]: valor } });
      dlg.close();
      await abrir(s.id); carregarLista();
    } catch (err) { $("dlgErro").textContent = err.message; }
    finally { $("dlgOk").disabled = false; }
  };
}

if (senha) entrar();
</script>
</body>
</html>
