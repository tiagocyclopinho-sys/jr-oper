<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <script>
    // PRIORIDADE 3 (Etapa 3 do plano de correção): backup de emergência,
    // autocontido e sem nenhuma dependência de js/app.js (pois o erro pode
    // estar justamente lá). Lê o localStorage bruto e força o download de um
    // .json antes de qualquer limpeza de dados.
    function baixarBackupEmergencia() {
      try {
        var dump = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          dump[k] = localStorage.getItem(k);
        }
        var carimbo = new Date().toISOString().replace(/[:.]/g, '-');
        var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'jr_oper_backup_emergencia_' + carimbo + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      } catch (e) {
        console.error('[Backup de Emergência] Falha ao gerar backup:', e);
      }
    }

    function limparCacheComBackup() {
      baixarBackupEmergencia();
      // Aguarda o navegador iniciar o download antes de apagar os dados.
      setTimeout(function () {
        localStorage.clear();
        sessionStorage.clear();
        location.reload();
      }, 500);
    }

    function showSystemError(msg, url, lineNo, colNo, error) {
      console.error("Erro Detectado:", msg, url, lineNo, colNo, error);
      var container = document.getElementById('main-content');
      if (container && (container.innerHTML.includes('Carregando') || container.innerHTML.trim() === '')) {
        var details = (error && (error.stack || error.message)) ? (error.stack || error.message) : String(msg);
        if (lineNo) details += ' (Linha: ' + lineNo + (colNo ? ', Col: ' + colNo : '') + ')';
        container.innerHTML = '<div style="background:#0f172a; border:2px solid #ef4444; border-radius:12px; padding:24px; max-width:650px; margin:40px auto; text-align:center; color:#ffffff; font-family:sans-serif; box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
          '<div style="font-size:36px; margin-bottom:10px;">⚠️</div>' +
          '<h2 style="font-size:18px; font-weight:bold; color:#f87171; margin-bottom:10px; text-transform:uppercase;">Falha na Inicialização do Sistema</h2>' +
          '<p style="font-size:12px; color:#cbd5e1; margin-bottom:15px;">Ocorreu um erro na execução da interface:</p>' +
          '<div style="background:#020617; color:#fca5a5; font-family:monospace; font-size:11px; padding:12px; border-radius:8px; border:1px solid #1e293b; text-align:left; overflow-x:auto; margin-bottom:20px; white-space:pre-wrap; max-height:200px;">' +
          '<b>Erro:</b> ' + details + '</div>' +
          '<p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">Um backup de emergência dos seus dados será baixado automaticamente antes de reiniciar o sistema.</p>' +
          '<button onclick="limparCacheComBackup()" style="background:#10b981; color:#ffffff; font-weight:bold; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-size:12px;">🔄 Limpar Cache e Reiniciar JR Oper</button>' +
          '</div>';
      }
    }
    window.onerror = function(msg, url, lineNo, colNo, error) {
      if (typeof msg === 'string' && (msg === "Script error." || msg.indexOf("Script error") !== -1)) {
        console.warn("Ignorado Script error. genérico do ambiente.");
        return true;
      }
      showSystemError(msg, url, lineNo, colNo, error);
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      console.error("Promessa rejeitada:", e.reason);
    });
  </script>

       1.8:1, e o subtitulo em text-emerald-100 sobre cinza claro da 1.04:1.

       Levantado com `grep -o 'text-[a-z]*-[1-4]00'` sobre js/app.js, para a
       lista sair do que o codigo usa de verdade e nao de suposicao. */
    html.light .text-emerald-100 { color: #047857 !important; }
    html.light .text-amber-100,
    html.light .text-yellow-400,
    html.light .text-yellow-300,
    html.light .text-yellow-200 { color: #b45309 !important; }
    html.light .text-red-100,
    html.light .text-rose-400,
    html.light .text-rose-300 { color: #b91c1c !important; }
    html.light .text-purple-200,
    html.light .text-purple-100,
    html.light .text-violet-400,
    html.light .text-violet-300,
    html.light .text-violet-200,
    html.light .text-fuchsia-400,
    html.light .text-fuchsia-300 { color: #6b21a8 !important; }
    html.light .text-blue-200,
    html.light .text-blue-100,
    html.light .text-indigo-400,
    html.light .text-indigo-300,
    html.light .text-indigo-200 { color: #1d4ed8 !important; }
    html.light .text-sky-400,
    html.light .text-sky-300,
    html.light .text-sky-200 { color: #0369a1 !important; }
    html.light .text-cyan-400,
    html.light .text-cyan-300,
    html.light .text-cyan-200,
    html.light .text-teal-400,
    html.light .text-teal-300 { color: #0e7490 !important; }
    html.light .text-orange-200,
    html.light .text-orange-100 { color: #c2410c !important; }

    /* 2. CORES DE TEXTO COM OPACIDADE (text-red-300/90 e afins)

       As regras de texto mais acima so citam a cor "cheia". As sete
       variantes com barra que existem no app caiam fora e ficavam com a cor
       clara do modo escuro. */
    html.light .text-emerald-400\/80,
    html.light .text-emerald-300\/90,
    html.light .text-emerald-300\/80 { color: #047857 !important; }
    html.light .text-amber-400\/80,
    html.light .text-amber-300\/80 { color: #b45309 !important; }
    html.light .text-red-400\/80,
    html.light .text-red-300\/90 { color: #b91c1c !important; }

    /* 3. BOTÕES E SELOS DE FUNDO SÓLIDO SATURADO

       O modo claro NAO altera esses fundos (bg-emerald-600, bg-red-600,
       bg-blue-700, ...), mas a regra `html.light .text-white` escurecia a
       letra. Resultado: cinza-chumbo sobre vermelho vivo - 3.7:1, reprovado.

       Como o fundo continua igual ao do modo escuro, a letra tambem tem de
       continuar: branca. */
    html.light .bg-emerald-500, html.light .bg-emerald-500 .text-white,
    html.light .bg-emerald-600, html.light .bg-emerald-600 .text-white,
    html.light .bg-emerald-700, html.light .bg-emerald-700 .text-white,
    html.light .bg-emerald-800, html.light .bg-emerald-800 .text-white,
    html.light .bg-red-500, html.light .bg-red-500 .text-white,
    html.light .bg-red-600, html.light .bg-red-600 .text-white,
    html.light .bg-red-700, html.light .bg-red-700 .text-white,
    html.light .bg-red-800, html.light .bg-red-800 .text-white,
    html.light .bg-blue-500, html.light .bg-blue-500 .text-white,
    html.light .bg-blue-600, html.light .bg-blue-600 .text-white,
    html.light .bg-blue-700, html.light .bg-blue-700 .text-white,
    html.light .bg-blue-800, html.light .bg-blue-800 .text-white,
    html.light .bg-purple-500, html.light .bg-purple-500 .text-white,
    html.light .bg-purple-600, html.light .bg-purple-600 .text-white,
    html.light .bg-purple-700, html.light .bg-purple-700 .text-white,
    html.light .bg-purple-800, html.light .bg-purple-800 .text-white,
    html.light .bg-violet-500, html.light .bg-violet-500 .text-white,
    html.light .bg-violet-600, html.light .bg-violet-600 .text-white,
    html.light .bg-violet-700, html.light .bg-violet-700 .text-white,
    html.light .bg-violet-800, html.light .bg-violet-800 .text-white,
    html.light .bg-sky-500, html.light .bg-sky-500 .text-white,
    html.light .bg-sky-600, html.light .bg-sky-600 .text-white,
    html.light .bg-sky-700, html.light .bg-sky-700 .text-white,
    html.light .bg-cyan-600, html.light .bg-cyan-600 .text-white,
    html.light .bg-cyan-700, html.light .bg-cyan-700 .text-white,
    html.light .bg-amber-700, html.light .bg-amber-700 .text-white,
    html.light .bg-amber-800, html.light .bg-amber-800 .text-white {
      color: #ffffff !important;
    }

    /* 4. HOVER QUE APAGAVA O BOTÃO NO MODO CLARO

       `hover:bg-slate-700` e `hover:bg-slate-800` (68 usos, quase todos em
       botao de barra de acao) pintavam o fundo de cinza-chumbo enquanto a
       letra ja estava escura - o botao sumia justamente ao passar o mouse. */
    html.light .hover\:bg-slate-700:hover,
    html.light .hover\:bg-slate-800:hover {
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
    }

    /* 5. EXCEÇÕES DA BARRA DO TOPO

       A barra fica verde-escura tambem no claro, e por isso `#header-bar *`
       pinta tudo de branco. Estes dois botoes tem fundo proprio e precisam
       escapar da regra - por isso vem depois e com especificidade maior
       (dois ids). */
    html.light #header-bar #btn-pwa-install,
    html.light #header-bar #btn-pwa-install * {
      color: #451a03 !important;
    }
    html.light #header-bar #user-info-area .bg-red-950 {
      background-color: rgba(127, 29, 29, 0.55) !important;
      border-color: #f87171 !important;
      color: #fecaca !important;
    }
    /* A pastilha do usuario (bg-emerald-950/60) tem de continuar ESCURA: ela
       fica sobre a barra verde-escura, onde a letra e branca. A regra de
       fundos translucidos do item 1 acima a clareava, e o nome do usuario
       virava branco no verde claro - 1.1:1. Dois ids garantem a precedencia. */
    html.light #header-bar #user-info-area [class*="bg-emerald-950/"],
    html.light #header-bar #user-info-area [class*="bg-emerald-900/"] {
      background-color: rgba(6, 78, 59, 0.65) !important;
      border-color: rgba(6, 95, 70, 0.8) !important;
      color: #ffffff !important;
    }

    /* 6. BOTÃO VERDE DE AÇÃO PRIMÁRIA

       emerald-600 com letra branca da 3.77:1 - abaixo do minimo AA, e isso
       vale para os dois temas. No claro da para corrigir de graca: o fundo
       da pagina e claro, entao o botao pode escurecer um tom sem perder
       destaque, e sobe para 5.0:1. O hover escurece mais - no modo claro,
       escurecer e a leitura natural de "estou sobre o botao". */
    html.light .bg-emerald-600,
    html.light .bg-emerald-500 {
      background-color: #047857 !important;
    }
    html.light .hover\:bg-emerald-500:hover,
    html.light .hover\:bg-emerald-600:hover {
      background-color: #065f46 !important;
    }
    /* Mesma historia no vermelho: bg-red-500 + branco da 3.76:1 (selo de
       contagem na Disponibilidade de Frota). red-700 leva para 6.4:1. */
    html.light .bg-red-500 {
      background-color: #b91c1c !important;
    }
    html.light .hover\:bg-red-500:hover {
      background-color: #991b1b !important;
    }

    /* ==========================================
       ESTILOS DE IMPRESSÃO (BOLETIM LIMPO)
       ========================================== */
    @media print {
      header, footer, #nav-menu, #nav-menu-overlay, #mobile-menu-dropdown, #btn-theme-toggle, #user-info-area, .no-print {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        color: #0f172a !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      .bg-slate-950, .bg-slate-900, .bg-slate-800 {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
        box-shadow: none !important;
      }
      .text-white, .text-slate-100, .text-slate-200, .text-slate-300 {
        color: #0f172a !important;
      }
      .text-slate-400, .text-slate-500 {
        color: #475569 !important;
      }
    }

    /* ==========================================
       ESTILOS DE CABEÇALHOS ORDENÁVEIS (TABLE SORTING)
       ========================================== */
    th.sortable-th,
    table:not(.no-auto-sort) thead th:not(.no-sort) {
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    th.sortable-th:hover,
    table:not(.no-auto-sort) thead th:not(.no-sort):hover {
      background-color: rgba(16, 185, 129, 0.15) !important;
      color: #34d399 !important;
    }
    html.light th.sortable-th:hover,
    html.light table:not(.no-auto-sort) thead th:not(.no-sort):hover {
      background-color: rgba(5, 150, 105, 0.15) !important;
      color: #047857 !important;
    }
    .th-sort-icon {
      display: inline-block;
      margin-left: 4px;
      font-size: 10px;
      line-height: 1;
      vertical-align: middle;
      opacity: 0.4;
      transition: opacity 0.15s, color 0.15s, transform 0.15s;
    }
    th:hover .th-sort-icon {
      opacity: 0.9;
    }
    th.sort-active-asc .th-sort-icon,
    th.sort-active-desc .th-sort-icon {
      opacity: 1 !important;
      font-weight: 900 !important;
    }
  </style>
</head>

  <script>
    function executarResetGlobalTreinamento() {
      // PRIORIDADE 7b/7f: modal customizado (em vez de prompt() nativo) +
      // confirmação dupla, já que esta ação apaga dados operacionais.
      if (typeof abrirModalConfirmacaoAdmin !== 'function') {
        alert('Erro ao carregar o app. Recarregue a página e tente novamente.');
        return;
      }
      abrirModalConfirmacaoAdmin({
        titulo: 'Reset Global de Treinamento',
        mensagem: 'Isso apaga todos os dados operacionais e de treinamento (devoluções, viagens, ocorrências, resumos). Cadastros mestre (usuários, motoristas, veículos, produtos) são preservados. Esta ação não pode ser desfeita.',
        palavraConfirmacao: 'RESETAR',
        onConfirm: (pwd) => {
          if (typeof db !== 'undefined' && typeof db.resetGlobalTreinamento === 'function') {
            const res = db.resetGlobalTreinamento(pwd);
            if (res.success) {
              alert(res.message);
              if (typeof closeCloudConfigPanel === 'function') closeCloudConfigPanel();
              location.reload();
            } else {
              alert(res.message);
            }
          } else {
            alert('Erro ao acessar o banco de dados.');
          }
        }
      });
    }
