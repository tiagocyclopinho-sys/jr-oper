  <script>
    // PRIORIDADE 3 (Etapa 3 do plano de correção): backup de emergência,
    // autocontido e sem nenhuma dependência de js/app.js (pois o erro pode
    // estar justamente lá). Lê o localStorage bruto e força o download de um
    // .json antes de qualquer limpeza de dados.
    function baixarBackupEmergencia() {
      try {
        var dump = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          dump[k] = localStorage.getItem(k);
        }
        var carimbo = new Date().toISOString().replace(/[:.]/g, '-');
        var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'jr_oper_backup_emergencia_' + carimbo + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      } catch (e) {
        console.error('[Backup de Emergência] Falha ao gerar backup:', e);
      }
    }

    function limparCacheComBackup() {
      baixarBackupEmergencia();
      // Aguarda o navegador iniciar o download antes de apagar os dados.
      setTimeout(function () {
        localStorage.clear();
        sessionStorage.clear();
        location.reload();
      }, 500);
    }

    function showSystemError(msg, url, lineNo, colNo, error) {
      console.error("Erro Detectado:", msg, url, lineNo, colNo, error);
      var container = document.getElementById('main-content');
      if (container && (container.innerHTML.includes('Carregando') || container.innerHTML.trim() === '')) {
        var details = (error && (error.stack || error.message)) ? (error.stack || error.message) : String(msg);
        if (lineNo) details += ' (Linha: ' + lineNo + (colNo ? ', Col: ' + colNo : '') + ')';
        container.innerHTML = '<div style="background:#0f172a; border:2px solid #ef4444; border-radius:12px; padding:24px; max-width:650px; margin:40px auto; text-align:center; color:#ffffff; font-family:sans-serif; box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
          '<div style="font-size:36px; margin-bottom:10px;">⚠️</div>' +
          '<h2 style="font-size:18px; font-weight:bold; color:#f87171; margin-bottom:10px; text-transform:uppercase;">Falha na Inicialização do Sistema</h2>' +
          '<p style="font-size:12px; color:#cbd5e1; margin-bottom:15px;">Ocorreu um erro na execução da interface:</p>' +
          '<div style="background:#020617; color:#fca5a5; font-family:monospace; font-size:11px; padding:12px; border-radius:8px; border:1px solid #1e293b; text-align:left; overflow-x:auto; margin-bottom:20px; white-space:pre-wrap; max-height:200px;">' +
          '<b>Erro:</b> ' + details + '</div>' +
          '<p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">Um backup de emergência dos seus dados será baixado automaticamente antes de reiniciar o sistema.</p>' +
          '<button onclick="limparCacheComBackup()" style="background:#10b981; color:#ffffff; font-weight:bold; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-size:12px;">🔄 Limpar Cache e Reiniciar JR Oper</button>' +
          '</div>';
      }
    }
    window.onerror = function(msg, url, lineNo, colNo, error) {
      if (typeof msg === 'string' && (msg === "Script error." || msg.indexOf("Script error") !== -1)) {
        console.warn("Ignorado Script error. genérico do ambiente.");
        return true;
      }
      showSystemError(msg, url, lineNo, colNo, error);
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      console.error("Promessa rejeitada:", e.reason);
    });
  </script>

        return;
      }
      abrirModalConfirmacaoAdmin({
        titulo: 'Reset Global de Treinamento',
        mensagem: 'Isso apaga todos os dados operacionais e de treinamento (devoluções, viagens, ocorrências, resumos). Cadastros mestre (usuários, motoristas, veículos, produtos) são preservados. Esta ação não pode ser desfeita.',
        palavraConfirmacao: 'RESETAR',
        onConfirm: (pwd) => {
          if (typeof db !== 'undefined' && typeof db.resetGlobalTreinamento === 'function') {
            const res = db.resetGlobalTreinamento(pwd);
            if (res.success) {
              alert(res.message);
              if (typeof closeCloudConfigPanel === 'function') closeCloudConfigPanel();
              location.reload();
            } else {
              alert(res.message);
            }
          } else {
            alert('Erro ao acessar o banco de dados.');
          }
        }
      });
    }
  </script>
